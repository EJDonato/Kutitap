<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kutitap · Floating focus bar</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="width: 440px; height: 600px; box-sizing: border-box; background: #2A3242; padding: 20px; display: flex; flex-direction: column; gap: 16px; font-family: Inter, system-ui, sans-serif; font-size: 14px; color: #F5F1E6">
<p style="margin: 0; font-size: 12px; color: #C9D2E0">Pop-out window that floats above other apps · 2 states</p>

<!-- RUNNING -->
<section aria-label="Focus running" style="background: #0E1A2B; border: 1px solid #33496A; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px">
<img src="../assets/titap-focused.png" alt="Titap focused" style="width: 52px; height: auto">
<div style="flex: 1; min-width: 0">
<p style="margin: 0; font-size: 12px; color: #AEB9CB">Focusing on</p>
<p style="margin: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Learn Figma: finish lesson 2</p>
</div>
<span style="font-family: Outfit, sans-serif; font-weight: 700; font-size: 32px; color: #FFD966; font-variant-numeric: tabular-nums">18:42</span>
</div>
<div style="height: 6px; background: #24364F; border-radius: 99px"><div style="width: 25%; height: 6px; background: #FFD966; border-radius: 99px"></div></div>
<div style="display: flex; gap: 8px">
<button type="button" style="flex: 1; min-height: 44px; border: 0; border-radius: 10px; background: #1E3049; color: #F5F1E6; font: inherit">Pause</button>
<button type="button" style="flex: 1; min-height: 44px; border: 0; border-radius: 10px; background: #1E3049; color: #F5F1E6; font: inherit">Done early</button>
<button type="button" aria-label="Back to app" style="width: 44px; min-height: 44px; border: 0; border-radius: 10px; background: #1E3049; color: #C9D2E0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 4h6v6M20 4l-8 8M10 6H5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5"/></svg></button>
</div>
<p style="margin: 0; font-size: 12px; color: #AEB9CB">Next: Send invoice · 1:30 PM</p>
</section>

<!-- CHECK-IN -->
<section aria-label="Check-in" style="background: #F5F1E6; color: #14213A; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px">
<img src="../assets/titap-calm.png" alt="" style="width: 48px; height: auto">
<div><p style="margin: 0; font-size: 12px; color: #4A5670">Time’s up · *kutitap*</p><p style="margin: 0; font-weight: 600; font-size: 15px">Did you finish lesson 2?</p></div>
</div>
<button type="button" style="min-height: 44px; border: 0; border-radius: 10px; background: #14213A; color: #F5F1E6; font: inherit; font-weight: 600">Done</button>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<button type="button" style="min-height: 40px; border: 1px solid #9AA6B8; border-radius: 8px; background: transparent; color: #14213A; font: inherit">+15 min</button>
<button type="button" style="min-height: 40px; border: 1px solid #9AA6B8; border-radius: 8px; background: transparent; color: #14213A; font: inherit">+30 min</button>
<button type="button" style="min-height: 40px; border: 1px solid #9AA6B8; border-radius: 8px; background: transparent; color: #14213A; font: inherit">+60 min</button>
</div>
<div style="display: flex; gap: 6px">
<button type="button" style="flex: 1; min-height: 40px; border: 0; background: transparent; color: #4A5670; font: inherit; text-decoration: underline">Partly done</button>
<button type="button" style="flex: 1; min-height: 40px; border: 0; background: transparent; color: #4A5670; font: inherit; text-decoration: underline">Skipped</button>
</div>
</section>
</div>
</body>
</html>
